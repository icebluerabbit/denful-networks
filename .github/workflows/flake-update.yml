name: Update Flake & Packages

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  update-flake:
    name: Update Flake Lock & Package Versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: icebluerabbit-${{ vars.CACHIX_CACHE }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
        continue-on-error: true

      - name: Update dev sub-flake lockfile
        run: nix flake update --flake ./dev

      - name: Update test sub-flake lockfile
        run: nix flake update --flake ./test

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
          base: dev
          branch: automated/weekly-flake-update
          commit-message: "chore: weekly flake lock update"
          title: "chore: weekly flake lock update"
          body: |
            Automated weekly update generated by GitHub Actions.

            Updates the `dev/` and `test/` sub-flake lockfiles.

            CI checks will run automatically on this PR targeting the `dev` branch.
          labels: |
            updates
            automated-pr
          delete-branch: true

      - name: Enable Auto-Merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
